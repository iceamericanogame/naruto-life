<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>닌자 세계에서 한 번뿐인 삶</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@900&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js" crossorigin="anonymous"></script>
<style>
:root{--ac:#b8352a;--ac2:#f3dcd8;--ink:#1d2433;--mute:#5d6674;--bg:#e8ecef;--card:#f8f9fa;--line:#cbd3da}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;line-height:1.6;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 80px}
.view{display:none}.view.on{display:block}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
.disp{font-family:"Black Han Sans","Noto Sans KR",sans-serif;font-weight:900;letter-spacing:-.02em}
/* hero */
.hero{position:relative;padding:44px 0 22px;overflow:hidden}
.hero .glyph{position:absolute;right:-18px;top:-34px;font-size:300px;line-height:1;color:var(--ac);opacity:.14;font-family:"Noto Serif KR","Noto Serif CJK KR",serif;font-weight:900;pointer-events:none;user-select:none}
.hero h1{position:relative;font-size:38px;line-height:1.15;margin:0 0 14px}
.hero p{position:relative;margin:0 0 8px;max-width:30em;color:#2c3445}
.hero small{position:relative;color:var(--mute)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin:14px 0}
.card h2{font-size:16px;margin:0 0 10px}
.card .hint{color:var(--mute);font-size:13px;margin:-4px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:8px 13px;border-radius:999px;border:1px solid var(--line);background:#fff;font-size:14px;min-height:40px}
.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chip small{display:block;font-size:11px;opacity:.7;line-height:1.2}
.btn{display:block;width:100%;padding:15px;border-radius:10px;background:var(--ac);color:#fff;font-weight:700;font-size:17px;text-align:center}
.btn.sec{background:#fff;color:var(--ink);border:1px solid var(--line);font-weight:500;font-size:15px}
.btn+.btn{margin-top:10px}
.eradesc{font-size:13px;color:var(--mute);margin-top:10px;min-height:3em}
.warn{font-size:12.5px;color:var(--mute);margin:10px 0 0}
.rec{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--line);font-size:14px}
.rec:first-child{border-top:0}
.rec .k{width:34px;height:34px;border-radius:6px;display:grid;place-items:center;color:#fff;font-weight:900;flex:none;font-family:"Noto Serif KR",serif}
.rec span{color:var(--mute);font-size:12.5px;display:block}
/* birth */
.roul{display:grid;place-items:center;min-height:60vh;text-align:center}
.roul .big{font-size:150px;line-height:1;font-family:"Noto Serif KR",serif;font-weight:900;color:var(--ac);transition:color .1s}
.bcard{margin-top:18px}
.bhead{display:flex;gap:14px;align-items:center}
.bk{width:78px;height:78px;border-radius:14px 14px 14px 4px;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:48px;font-family:"Noto Serif KR",serif;font-weight:900;flex:none}
.bhead h2{margin:0;font-size:24px}
.bhead div div{color:var(--mute);font-size:13.5px}
dl.kv{margin:12px 0 0;display:grid;grid-template-columns:5.5em 1fr;gap:6px 10px;font-size:14.5px}
dl.kv dt{color:var(--mute)}dl.kv dd{margin:0}
.nat{display:inline-flex;align-items:center;gap:6px;padding:4px 10px 4px 5px;border-radius:999px;background:#fff;border:1px solid var(--line);margin:2px 4px 2px 0;font-size:14px}
.nat b{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:#fff;font-size:13px;font-family:"Noto Serif KR",serif}
/* life */
.top{position:sticky;top:0;z-index:20;background:rgba(232,236,239,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin:0 -16px;padding:10px 16px}
.top .row{display:flex;align-items:center;gap:12px}
.age{font-size:44px;line-height:1;min-width:2.3em;color:var(--ac)}
.age small{font-size:16px;color:var(--ink);margin-left:2px}
.era{font-size:12.5px;color:var(--mute);line-height:1.35;flex:1}
.era b{color:var(--ink);font-weight:700;display:block;font-size:13.5px}
.ctl{display:flex;gap:6px;margin-top:8px;align-items:center;flex-wrap:wrap}
.ctl .chip{padding:5px 11px;min-height:36px;font-size:13px}
.ctl .grow{flex:1}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;background:var(--ac2);color:var(--ink);font-size:12.5px;margin:2px 4px 2px 0}
.prof h2{margin:0;font-size:22px}
.prof .sub{color:var(--mute);font-size:13.5px;margin:2px 0 8px}
.bars{display:grid;gap:8px;margin-top:6px}
.bar{display:grid;grid-template-columns:3.6em 1fr 2.2em;gap:8px;align-items:center;font-size:13.5px}
.bar i{height:8px;border-radius:4px;background:#dfe5ea;overflow:hidden;display:block}
.bar i u{display:block;height:100%;background:var(--ac);border-radius:4px;transition:width .5s}
.bar em{font-style:normal;color:var(--mute);text-align:right;font-size:12.5px}
.sep{height:1px;background:var(--line);margin:10px 0}
.log{margin:0;padding:0;list-style:none}
.log h3{margin:14px 0 4px;font-size:15px;color:var(--ac)}
.log h3 small{font-weight:400;color:var(--mute);font-size:12px;margin-left:6px}
.log li{padding:3px 0 3px 9px;border-left:3px solid var(--line);margin:3px 0;font-size:14px;line-height:1.5;display:flex;gap:8px;align-items:baseline}
.log li .ag{color:var(--ac);font-weight:700;font-size:13px;flex:none;min-width:2.6em}
.log li small{display:none}
.log li span{flex:1}
.log li.new{background:var(--ac2)}
.log li.g{border-color:#4a9a5f}.log li.b{border-color:#c4553d}.log li.w{border-color:#394255;background:#e0e5ea}.log li.m{border-color:var(--ac);font-weight:500}.log li.d{border-color:var(--ink);background:#d9dee3;font-weight:700}
.peer{display:flex;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.peer:first-of-type{border-top:0}
.peer .k{width:30px;height:30px;border-radius:5px;color:#fff;display:grid;place-items:center;font-family:"Noto Serif KR",serif;font-weight:900;flex:none}
.peer.dead{opacity:.55}
.peer span{display:block;color:var(--mute);font-size:12.5px}
.map{display:grid;grid-template-columns:repeat(10,1fr);gap:3px}
.map i{aspect-ratio:1;border-radius:3px;background:#dbe1e6}
.map i.cur{outline:2px solid var(--ink);outline-offset:1px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--mute);margin-top:10px}
.leg b{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:4px}
.ph-child{background:#9db2c4!important}.ph-acad{background:#6aa6c9!important}.ph-genin{background:#58a36a!important}.ph-chunin{background:#d3a53a!important}.ph-jonin{background:#d4662f!important}.ph-anbu{background:#5b4a7a!important}.ph-rogue{background:#9a2f2f!important}.ph-civ{background:#b9926a!important}.ph-ret{background:#8a97a3!important}.ph-dead{background:#1d2433!important}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
/* sheet */
#sheetbg{position:fixed;inset:0;background:rgba(20,26,38,.5);z-index:50;display:none;align-items:center;justify-content:center;padding:16px}
#sheetbg.on{display:flex}
#sheet{background:var(--card);width:100%;max-width:560px;max-height:84vh;overflow:auto;border-radius:18px;padding:20px 18px 22px;animation:pop .2s ease-out;box-shadow:0 18px 50px rgba(0,0,0,.35)}
@keyframes pop{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
#sheet h2{margin:0 0 6px;font-size:21px}
#sheet p.b{margin:0 0 14px;color:#2c3445}
.opt{display:block;width:100%;text-align:left;padding:13px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:9px}
.opt b{display:block;font-size:16px}.opt span{font-size:13px;color:var(--mute)}
.opt:active{background:var(--ac2)}
.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;min-height:70px;background:#fff}
.nrow{display:flex;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
.nrow:first-child{border-top:0}
.nrow .k{width:40px;height:40px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:22px;font-family:"Noto Serif KR",serif;font-weight:900;flex:none}
.nrow div{font-size:13.5px}.nrow b{font-size:15px}
.tl{margin:0;padding:0;list-style:none;font-size:14px}
.tl li{padding:6px 0 6px 12px;border-left:3px solid var(--ac);margin:4px 0}
.tl small{color:var(--mute);display:block;font-size:12px}
/* death */
.dcard{border:2px solid var(--ink);border-radius:14px 14px 14px 4px;background:var(--card);padding:20px;margin-top:20px;position:relative;overflow:hidden}
.dcard .glyph{position:absolute;right:-10px;top:-30px;font-size:200px;opacity:.1;color:var(--ac);font-family:"Noto Serif KR",serif;font-weight:900;line-height:1}
.dcard h2{font-size:28px;margin:0 0 4px;position:relative}
.dcard p{position:relative}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.top .row .mini{display:flex;gap:6px;flex:none}
.chip.sm{padding:4px 11px;min-height:32px;font-size:12.5px}
.chk{display:flex;gap:12px;align-items:flex-start;cursor:pointer;font-size:15px}
.chk input{width:22px;height:22px;margin-top:2px;accent-color:var(--ac);flex:none}
.chk small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px;line-height:1.45}
.shotfoot{text-align:center;color:var(--mute);font-size:12px;margin:18px 0 6px}
img.shot{width:100%;border:1px solid var(--line);border-radius:8px;margin:6px 0 12px;display:block}
.pa{display:grid;place-items:center;gap:12px;margin:6px 0 14px}
.wheel{position:relative;width:210px;height:210px}
.wheel i{position:absolute;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:"Noto Serif KR",serif;font-weight:900;font-size:27px;color:#fff;opacity:.3;transition:transform .12s,opacity .12s}
.wheel i.on{opacity:1;transform:scale(1.22)}
.wheel i.win{opacity:1;transform:scale(1.5);box-shadow:0 0 0 6px var(--ac2)}
.wheel i.win2{opacity:1;transform:scale(1.2)}
.wheel.done i:not(.win):not(.win2){opacity:.1;transform:scale(.8)}
.pbox{position:relative;width:132px;height:178px}
.ppr{position:absolute;inset:0;background:#fff;border:1px solid #d3d8dd;box-shadow:0 4px 10px rgba(0,0,0,.16);overflow:hidden}
.pmsg{min-height:4.6em;text-align:center;font-size:14px;line-height:1.5;max-width:30em}
/* 불: 아래에서부터 타오른다 */
.fx-fire .burn{position:absolute;left:0;right:0;bottom:0;height:0;background:linear-gradient(to top,#1d1109 0%,#5a1d08 30%,#d4561f 62%,#ffb23f 86%,#ffe9a8 100%);animation:burn 1.7s ease-in forwards}
.fx-fire{animation:ash 1.9s ease-in forwards}
@keyframes burn{0%{height:0}85%{height:108%}100%{height:112%;opacity:.0}}
@keyframes ash{0%,80%{opacity:1}100%{opacity:.18}}
/* 바람: 반으로 갈라진다 */
.fx-wind{background:transparent;border:0;box-shadow:none;overflow:visible}
.fx-wind .hf{position:absolute;top:0;bottom:0;width:50%;background:#fff;border:1px solid #d3d8dd;box-shadow:0 4px 10px rgba(0,0,0,.16)}
.fx-wind .hf.l{left:0;clip-path:polygon(0 0,100% 0,88% 10%,100% 22%,88% 34%,100% 46%,88% 58%,100% 70%,88% 82%,100% 100%,0 100%);animation:wl 1.6s .6s ease-out forwards}
.fx-wind .hf.r{right:0;clip-path:polygon(0 0,100% 0,100% 100%,0 100%,12% 90%,0 78%,12% 66%,0 54%,12% 42%,0 30%,12% 18%,0 8%);animation:wr 1.6s .6s ease-out forwards}
.fx-wind .streak{position:absolute;left:-30%;top:46%;width:160%;height:3px;background:linear-gradient(90deg,transparent,#8fd8cf,#fff,transparent);opacity:0;animation:streak .7s .1s ease-out}
.fx-wind .streak.s2{top:58%;animation-delay:.25s}
@keyframes wl{to{transform:translate(-26px,8px) rotate(-9deg)}}
@keyframes wr{to{transform:translate(26px,-4px) rotate(9deg)}}
@keyframes streak{0%{opacity:0;transform:translateX(-40%)}40%{opacity:1}100%{opacity:0;transform:translateX(40%)}}
/* 물: 젖어 든다 */
.fx-water .wet{position:absolute;left:50%;top:50%;width:230%;height:230%;margin:-115% 0 0 -115%;border-radius:50%;background:radial-gradient(circle,#5a95d4 0%,#8ab6e4 45%,rgba(150,195,235,.0) 72%);transform:scale(0);animation:wet 1.7s ease-out forwards}
.fx-water{animation:soak 1.9s ease-out forwards}
.fx-water .drop{position:absolute;top:80%;width:9px;height:13px;border-radius:50% 50% 50% 50%/60% 60% 40% 40%;background:#3d7cc9;opacity:0;animation:drip 1.2s 1s ease-in forwards}
.fx-water .d1{left:26%}.fx-water .d2{left:52%;animation-delay:1.2s}.fx-water .d3{left:76%;animation-delay:1.35s}
@keyframes wet{to{transform:scale(1)}}
@keyframes soak{to{background:#b9d3ee}}
@keyframes drip{0%{opacity:0;transform:translateY(0)}20%{opacity:1}100%{opacity:0;transform:translateY(60px)}}
/* 흙: 바스라진다 */
.fx-earth{overflow:visible}
.fx-earth .tile{position:absolute;width:20%;height:14.3%;background:#fbf8f2;border:1px solid #cfc7b9;animation:crumb 1.3s ease-in forwards}
@keyframes crumb{0%,18%{transform:none;opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(var(--r));opacity:0}}
/* 번개: 구겨진다 */
.fx-lightning{animation:crumple 1.8s ease-in-out forwards;transform-origin:50% 50%}
.fx-lightning .fold{position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(0,0,0,0) 0 11px,rgba(80,80,80,.28) 12px 13px),repeating-linear-gradient(35deg,rgba(0,0,0,0) 0 15px,rgba(120,120,120,.22) 16px 17px);opacity:0;animation:fold 1.8s forwards}
.fx-lightning .zap{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,rgba(255,228,110,.9),rgba(255,228,110,0) 60%);opacity:0;animation:zap .9s ease-out}
@keyframes crumple{0%{transform:none}30%{transform:scale(1,1) skew(2deg,1deg)}60%{transform:scale(.8,.74) skew(-6deg,3deg)}100%{transform:scale(.58,.52) skew(8deg,-4deg);clip-path:polygon(8% 4%,40% 0,72% 8%,96% 22%,88% 60%,100% 92%,56% 100%,22% 94%,0 70%,6% 36%)}}
@keyframes fold{to{opacity:1}}
@keyframes zap{0%{opacity:0}20%{opacity:1}35%{opacity:.2}50%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.fx-fire .burn,.fx-wind .hf,.fx-water .wet,.fx-earth .tile,.fx-lightning{animation-duration:.01s!important;animation-delay:0s!important}}

.pres{display:flex;gap:18px;justify-content:center}
.pres .rk{display:grid;justify-items:center;gap:4px;animation:rkin .6s ease-out both}
.pres .rk i{width:78px;height:78px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-family:"Noto Serif KR",serif;font-weight:900;font-size:40px;color:#fff;box-shadow:0 0 0 5px rgba(120,90,180,.18)}
.pres .rk:nth-child(2){animation-delay:.25s}
.pres .rk b{font-size:12px;color:var(--mute)}
@keyframes rkin{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}

.chk.sm{margin:6px 0 0;font-size:13px}.chk.sm input{width:16px;height:16px}

#sheetbg.peek{display:none!important}
#peekbar{position:fixed;left:0;right:0;bottom:0;z-index:60;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(20,26,38,.88);justify-content:center}
#peekbar .btn{max-width:560px;margin:0}
.peekb{float:right;margin:0 0 6px 8px}
.logbox{max-height:15.5em;overflow-y:auto;overscroll-behavior:contain;padding-right:4px}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:10px;font-size:12.5px;color:var(--mute)}
.legend span{display:inline-flex;align-items:center;gap:5px}.legend i{width:12px;height:12px;border-radius:3px;display:inline-block}
.focus{margin:10px 0 12px;padding:10px 12px;background:var(--bg2,rgba(0,0,0,.04));border-radius:12px}
.focus .fh{font-size:12.5px;font-weight:700;color:var(--mute);margin-bottom:6px}
</style></head><body>
<div id="home" class="view"></div><div id="birth" class="view"></div><div id="life" class="view"></div><div id="death" class="view"></div>
<div id="sheetbg"><div id="sheet" role="dialog" aria-modal="true"></div></div><div id="peekbar" style="display:none"><button class="btn" id="peekbtn">선택지 다시 열기</button></div>
<script>
// ================= DATA =================
const NK=['fire','wind','water','earth','lightning'];
const NATURE={
 fire:{n:'불',k:'火',j:'화둔',col:'#e4572e',d:'호쾌한 화염. 거대한 불덩이로 길을 연다.',paper:'종이가 순식간에 타올랐다'},
 wind:{n:'바람',k:'風',j:'풍둔',col:'#4f9d93',d:'칼날 같은 바람. 베어 가르고, 불길을 키운다.',paper:'종이가 반으로 갈라졌다'},
 water:{n:'물',k:'水',j:'수둔',col:'#3d7cc9',d:'형태 없는 유연함. 지형과 습기가 곧 무기다.',paper:'종이가 축축하게 젖었다'},
 earth:{n:'흙',k:'土',j:'토둔',col:'#a47a3a',d:'단단한 방벽. 땅을 일으켜 지키고, 가른다.',paper:'종이가 구겨져 부스러졌다'},
 lightning:{n:'번개',k:'雷',j:'뇌둔',col:'#c29a14',d:'찰나의 속도. 관통력이 가장 강하다.',paper:'종이가 우글쭈글하게 구겨졌다'}
};
const BEATS={fire:'wind',wind:'lightning',lightning:'earth',earth:'water',water:'fire'};
const COMBOS=[
 {a:['water','wind'],n:'빙둔(氷遁)',d:'물과 바람을 섞어 얼음을 다룬다.'},
 {a:['water','fire'],n:'비등둔(沸遁)',d:'물과 불을 섞어 끓는 증기를 뿜는다.'},
 {a:['earth','fire'],n:'용둔(熔遁)',d:'흙과 불을 섞어 녹아내린 용암을 부린다.'},
 {a:['water','lightning'],n:'람둔(嵐遁)',d:'물과 번개를 섞어 폭풍을 일으킨다.'},
 {a:['earth','lightning'],n:'폭둔(爆遁)',d:'흙과 번개를 섞어 폭발을 일으킨다.'},
 {a:['wind','earth'],n:'자둔(磁遁)',d:'바람과 흙을 섞어 사철과 자력을 다룬다.'},
 {a:['wind','fire'],n:'작둔(灼遁)',d:'바람과 불을 섞어 뜨거운 열풍을 일으킨다.'}

const FOCI={balance:'균형 있게',train:'수련',study:'학업',people:'가족과 사람',work:'일과 돈',rest:'휴식과 건강',roam:'여행과 모험'};
function growStats(p,c){
 const a=p.age,f=p.focus,S=p.st;
 // 건강
 let hd=a<20?.8:a<35?0:-(0.25+(a-35)*.045);
 if(f==='rest')hd+=3;if(f==='train'&&a<45)hd+=.8;
 if(p.flags.chronic)hd-=1.5;
 if(p.cls<=1)hd-=.8;
 S.health=cl(S.health+hd+gauss()*1.5);
 // 행복
 let tgt=55+(p.cls-3)*3+(S.bond-50)*.25+(S.health-60)*.12-(p.flags.trauma||0)*3;
 if(f==='people')tgt+=5;if(f==='rest')tgt+=3;
 if(hasT(p,'cold'))tgt-=4;if(hasT(p,'guilt'))tgt-=3;if(hasT(p,'kind'))tgt+=2;S.happy=cl(S.happy+(tgt-S.happy)*.2+gauss()*2);
 // 관계
 let bt=50+(f==='people'?14:0)+(p.fam.spouse&&p.fam.spouse.alive?6:0)+(p.fam.kids.length?3:0)-(p.role==='anbu'||p.role==='root'?15:0)-(p.track==='rogue'?20:0)-(hasT(p,'cold')?6:0)-(hasT(p,'loner')?6:0)+(hasT(p,'kind')?4:0)+(hasT(p,'loyal')?3:0);
 S.bond=cl(S.bond+(bt-S.bond)*.15+gauss()*2);
 // 지식
 let kg=a<6?1.5:a<18?(p.track==='academy'?3.5:2.2):a<40?.8:.2;if(f==='study')kg+=2.5;
 kg*=(0.7+p.tal/150+(p.cls>=4?.2:0)+(p.cls<=1?-.2:0));
 S.know=cl(S.know+kg);
 // 닌자 능력
 const ninjaish=p.track==='academy'||isNin(p)||(p.flags.trainer&&ch(.3));
 p.sk.chakra=Math.min(p.pot+ (p.track==='child'?0:0),p.sk.chakra+(a<18?1.4:a<35?.5:0)+(f==='train'?.8:0)+(ninjaish?.8:0));
 if(ninjaish&&a>=5){
  let g=(.6+p.tal/65)*(f==='train'?2.2:1);
  if(p.track==='academy')g*=1.1;
  if(p.rank>=3||p.age>40)g*=.55;
  if(a>55)g*=-.4;
  const w={tai:1,nin:1,gen:.8};
  if(NN(p).id==='lightning')w.tai+=.5;if(p.clan==='uchiha'||p.clan==='uzumaki')w.nin+=.4;if(p.clan==='hyuga'||p.clan==='inuzuka'||p.clan==='akimichi')w.tai+=.5;
  if(p.role==='medic'||p.role==='sealer')w.nin+=.6;if(p.role==='intel'||p.role==='sensor')w.gen+=.8;if(p.clan==='nara'||p.clan==='yamanaka')w.gen+=.5;
  for(const k of ['tai','nin','gen'])p.sk[k]=cl(p.sk[k]+g*w[k]*(.6+R()*.8));
 }
 // 소득
 if(a>=14){
  let inc=0;
  if(p.track==='civ'){inc=(JOBS[p.job]||1.2)*18000*(0.55+p.jobLv*.4)*(0.8+R()*.4)*(p.flags.deprOn?0:(p.depr>=30?.8:1));if(f==='work')inc*=1.25}
  else if(p.track==='ninja'){inc=[0,16000,38000,95000][p.rank]*(p.role==='anbu'?1.3:1)*(0.8+R()*.4);if(p.flags.kage)inc=3500000}
  else if(p.track==='rogue')inc=(p.flags.mercenary?60000:8000)*(0.5+R());
  else if(p.track==='retired')inc=22000;
  const cost=13000+Math.max(0,p.money)*.06-(p.flags.house?4000:0)+(p.fam.spouse?6000:0)+kidCost(p)+(p.flags.chronic?5000:0);
  p.money+=inc-cost;
  if(p.money<0&&p.money<-30000)p.money=-30000;
 }
}

   L(p,t,'w');add(p,'happy',-6);p.money-=rnd(2000,12000);

function roleLine(p,cls,d,ok,tm){
 const r=p.role==='root'?'anbu':p.role;
 if(r==='anbu')return ok?`${cls}급 암부 임무「${d}」를 수행했다. 보고서에는 별칭만 남았다.`:`${cls}급 암부 임무「${d}」가 어긋났다. 상부는 이유를 묻지 않았다.`;
 if(r==='medic')return ok?`${tm}${cls}급 의료 임무「${d}」를 마쳤다. ${pick(['환자들이 한숨을 돌렸다.','피 묻은 손이 마른 뒤에야 긴장이 풀렸다.','치료받은 병사가 고개를 숙였다.'])}`:`${tm}${cls}급 의료 임무「${d}」에서 끝내 살리지 못한 사람이 있었다.`;
 if(r==='sensor')return ok?`${tm}${cls}급 감지 임무「${d}」를 완수했다. 먼저 알아챈 덕에 아무도 다치지 않았다.`:`${tm}${cls}급 감지 임무「${d}」에서 적의 차크라를 놓쳤다. 대가는 컸다.`;
 if(r==='intel')return ok?`${tm}${cls}급 첩보 임무「${d}」에서 필요한 정보를 얻어냈다.`:`${tm}${cls}급 첩보 임무「${d}」가 새어 나갔다. 정체가 의심받았다.`;
 if(r==='inst')return ok?`${cls}급 교육 임무「${d}」를 무사히 마쳤다.`:`${cls}급 교육 임무「${d}」에서 학생이 다치는 사고가 있었다.`;
 if(r==='sealer')return ok?`${tm}${cls}급 봉인 임무「${d}」를 마쳤다. 인장이 하얗게 빛나다 가라앉았다.`:`${tm}${cls}급 봉인 임무「${d}」의 인장이 흔들렸다. 겨우 수습했다.`;
 if(r==='puppet')return ok?`${tm}${cls}급 임무「${d}」에서 인형이 제 몫을 했다.`:`${tm}${cls}급 임무「${d}」에서 인형 여러 구를 잃었다.`;
 if(r==='hunter')return ok?`${tm}${cls}급 추적 임무「${d}」를 마무리했다.`:`${tm}${cls}급 추적 임무「${d}」에서 표적을 놓쳤다.`;
 return ok?`${tm}${cls}급 전투 임무「${d}」를 완수했다. 적을 제압했다.`:`${tm}${cls}급 전투 임무「${d}」에서 적에게 밀려 퇴각했다.`;
}
function roleFx(p,cls,ok){
 const r=p.role==='root'?'anbu':p.role;const g={D:1,C:2,B:3,A:4,S:6}[cls];
 if(r==='field'){sk(p,'tai',g*.6);sk(p,'nin',g*.6);if(ok&&ch(.4))p.kills+=rnd(1,3);p.flags.enemy=(p.flags.enemy||0)+1}
 if(r==='medic'){sk(p,'nin',g*.5);add(p,'know',g*.5);if(ok)p.flags.saved=(p.flags.saved||0)+rnd(1,g*2);else{add(p,'happy',-4);p.flags.lost=(p.flags.lost||0)+1}}
 if(r==='sensor'){sk(p,'gen',g*.6);sk(p,'chakra',g*.3);if(!ok)add(p,'health',-3)}
 if(r==='intel'){sk(p,'gen',g*.5);add(p,'know',g*.6);if(ok)p.flags.intel=(p.flags.intel||0)+1}
 if(r==='anbu'){add(p,'happy',-2);add(p,'bond',-1);if(ok&&ch(.6))p.kills+=rnd(1,3);p.flags.dark=(p.flags.dark||0)+1}
 if(r==='hunter'&&ok&&ch(.4))p.kills+=1;
}

const LATER={};
function later(p,d,key,data){p.sched.push({at:p.age+d,key,data:data||{}})}
function runSched(p){
 const due=p.sched.filter(s=>s.at<=p.age);p.sched=p.sched.filter(s=>s.at>p.age);
 for(const s of due){if(p.dead)return;if(LATER[s.key])LATER[s.key](p,s.data,p.age-(s.at-(s.data&&s.data.d||0)))}
}
const TRN={cold:'냉혹함',kind:'자비로움',loyal:'의리',ambit:'야망',loner:'고독',trust:'신뢰받는 심문관',feared:'공포의 심문관',brave:'용맹',cautious:'신중함',guilt:'죄책감'};
function tr(p,k,v){p.tr[k]=(p.tr[k]||0)+(v==null?1:v)}
const hasT=(p,k)=>(p.tr[k]||0)>=2;
function traitPills(p){return Object.keys(TRN).filter(k=>hasT(p,k)).map(k=>TRN[k])}
function yrs(p,a){return p.age-a}

// ---------- 신문: 방식에 따라 미래가 갈린다 ----------
function interroAsk(p){
 const I=p.interro;
 const hist=I.talk+I.gen+I.tort?` (지금까지 회유 ${I.talk}회, 환술 ${I.gen}회, 고문 ${I.tort}회)`:'';
 ask(p,{title:'포로 신문',body:'적 닌자 한 명을 사로잡았다. 중요한 정보를 쥐고 있을 것이다. 어떻게 신문할까?'+hist,opts:[
  {l:'회유한다',s:'시간이 걸리지만 신뢰가 남고, 훗날 인연이 돌아올 수 있다',a:3,f:p=>{
    I.talk++;const ok=ch(cl(.42+I.talk*.05+(hasT(p,'kind')?.1:0)+(p.st.know-40)/200-(hasT(p,'feared')?.1:0),.2,.88));
    if(ok){p.flags.intel=(p.flags.intel||0)+1;tr(p,'trust');tr(p,'kind',.5);L(p,'차를 나누며 몇 시간을 이야기한 끝에 포로가 스스로 입을 열었다.','g');later(p,rnd(2,6),'informant',{a:p.age})}
    else{L(p,'회유는 먹히지 않았다. 포로는 끝까지 침묵했고, 다음 심문관에게 넘겨졌다.','n');tr(p,'cautious',.5)}}},
  {l:'환술로 캐낸다',s:'확실하지만 포로의 정신이 상하고, 내 환술 평판이 갈린다',a:3,f:p=>{
    I.gen++;sk(p,'gen',4);p.flags.intel=(p.flags.intel||0)+1;L(p,'환술로 포로의 기억을 헤집어 정보를 얻었다. 포로는 한동안 정신을 놓았다.','n');later(p,rnd(1,3),'genback',{a:p.age})}},
  {l:'고문한다',s:'가장 빠르고 확실하다. 대신 나도 변하고, 원한이 남는다',a:2,f:p=>{
    I.tort++;p.flags.torture=(p.flags.torture||0)+1;p.flags.intel=(p.flags.intel||0)+2;add(p,'happy',-10);tr(p,'cold');tr(p,'feared');
    L(p,'고문으로 정보를 얻어냈다. 그날 밤, 손에 남은 감촉이 지워지지 않았다. 필요한 일이었다고 되뇌었다.','b');
    later(p,rnd(2,4),'tortureEcho',{});later(p,rnd(4,9),'revenge',{a:p.age});if(I.tort>=3&&!p.flags.tiUnit)later(p,1,'tiUnit',{})}}
 ]});
}
LATER.informant=(p,d)=>{L(p,`${p.age-d.a}년 전 회유했던 포로가 인편으로 소식을 보냈다. 적진의 움직임을 귀띔해 주었다. 말로 얻은 신뢰가 정보로 돌아왔다.`,'m');p.flags.intel=(p.flags.intel||0)+2;p.fame=(p.fame||0)+2;add(p,'bond',3);add(p,'happy',3)};
LATER.genback=(p,d)=>{
 if(ch(.55)){L(p,`${p.age-d.a}년 전 환술로 기억을 헤집은 포로가 폐인이 되었다는 보고가 올라왔다. 상부는 내 환술을 높이 평가해 특수 심문 임무를 맡겼다.`,'m');p.flags.genMaster=(p.flags.genMaster||0)+1;p.fame=(p.fame||0)+2;sk(p,'gen',4);tr(p,'cold',.5)}
 else{L(p,'환술 반동으로 밤마다 포로의 기억 속 장면이 꿈에 겹쳐 나왔다.','b');add(p,'health',-6);add(p,'happy',-5)}
};

  {l:'더 단단해지려 한다',s:'감정을 무뎌지게 만든다',a:2,f:p=>{tr(p,'cold',1.5);tr(p,'feared');add(p,'bond',-5);add(p,'happy',-2);L(p,'감정을 눌러 담는 법을 익혔다. 이제 비명도 잘 들리지 않는다.','b')}}

function showShot(url,name){
 openSheet(`<h2 class="disp">이미지가 만들어졌어요</h2><p class="hint">이미지를 길게 누르거나 아래 버튼으로 저장하세요.</p><img class="shot" alt="인생 결과 이미지" src="${url}"><a class="btn" id="dl" download="${esc(name)}.png" href="${url}">이미지 파일로 저장</a><button class="btn sec" id="shr">공유하기</button><button class="btn sec" id="cl">닫기</button>`);
 $('#cl').onclick=()=>closeSheet(true);
 $('#shr').onclick=async()=>{try{const b=await (await fetch(url)).blob();const f=new File([b],name+'.png',{type:'image/png'});if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:'닌자 세계에서 한 번뿐인 삶'});else $('#shr').textContent='이 기기에서는 공유를 지원하지 않아요'}catch(e){}};
}
async function saveShot(){

 try{
  if(window.html2canvas){
   const node=document.querySelector('#death .wrap');

}
